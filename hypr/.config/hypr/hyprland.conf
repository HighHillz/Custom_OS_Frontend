# --- MONITORS ---
monitor=,preferred,auto,1

# --- AUTOSTART ---
exec-once = swww-daemon
exec-once = swww img ~/dotfiles/wallpapers/theme_2-garden_city.png
exec-once = waybar

# --- KEYBINDINGS ---
$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, nautilus
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, D, exec, ~/dotfiles/scripts/toggle_desktop.sh
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, PERIOD, exec, wofi-emoji

# --- TOUCHPAD TOGGLE (F11 or Fn + F11) ---
bind = , XF86TouchpadToggle, exec, ~/dotfiles/scripts/toggle_touchpad.sh && pkill -SIGRTMIN+9 waybar

# --- CAPS / NUM LOCK — signal status bar for instant update ---
bind = , Caps_Lock, exec, pkill -SIGRTMIN+9 waybar
bind = , Num_Lock,  exec, pkill -SIGRTMIN+9 waybar

# --- VOLUME CONTROL (Fn volume keys) ---
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && date +%s > /tmp/waybar_volume_hud && pkill -SIGRTMIN+8 waybar
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && date +%s > /tmp/waybar_volume_hud && pkill -SIGRTMIN+8 waybar
binde = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && date +%s > /tmp/waybar_volume_hud && pkill -SIGRTMIN+8 waybar

input {
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
        disable_while_typing = yes
        scroll_factor = 1.0
        
        # Enables drag lock (finger can be lifted briefly while dragging)
        drag_lock = false
        
        # 1 finger = left click, 2 fingers = right click, 3 fingers = middle click
        clickfinger_behavior = yes
    }
}

# --- SCREEN BRIGHTNESS ---
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5% && date +%s > /tmp/waybar_brightness_hud && pkill -SIGRTMIN+8 waybar
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && date +%s > /tmp/waybar_brightness_hud && pkill -SIGRTMIN+8 waybar

# --- KEYBOARD BACKLIGHT BRIGHTNESS (Fn + Keyboard Light Key) ---
binde = , XF86KbdBrightnessUp, exec, brightnessctl --device='*kbd_backlight*' set +33%
binde = , XF86KbdBrightnessDown, exec, brightnessctl --device='*kbd_backlight*' set 33%-

# --- SCREENSHOT (PrtSc) ---
# Area screenshot to file + clipboard
bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/Screenshot_$(date +'%Y%m%d_%H%M%S').png && wl-copy < ~/Pictures/Screenshots/Screenshot_$(date +'%Y%m%d_%H%M%S').png
# Fullscreen screenshot
bind = $mainMod, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/Screenshot_$(date +'%Y%m%d_%H%M%S').png

# Window Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

# --- LOOK AND FEEL ---
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(00e5c3ee) rgba(3dffa0ee) 45deg
    col.inactive_border = rgba(1a3d2aaa)
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 0.95
    inactive_opacity = 0.85
}

# --- ANIMATIONS ---
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}
