# ╔═══════════════════════════════════════════════════════╗
# ║         HYPRLOCK — Garden City Theme                  ║
# ║  Palette: jade #00e5c3 · emerald #3dffa0 · sky #a8e6f0 ║
# ╚═══════════════════════════════════════════════════════╝

# ─── BACKGROUND ───────────────────────────────────────────
background {
    monitor =
    path = ~/dotfiles/wallpapers/theme_2-garden_city.png
    blur_passes = 3
    blur_size = 6
    noise = 0.0100
    contrast = 0.85
    brightness = 0.35
    vibrancy = 0.25
    vibrancy_darkness = 0.5
}

# ─── GENERAL ──────────────────────────────────────────────
general {
    hide_cursor = true
}

# ─── DECORATIVE TOP ACCENT LINE ───────────────────────────
label {
    monitor =
    text =   ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  
    color = rgba(0, 229, 195, 0.20)
    font_size = 9
    font_family = Maple Mono NF
    position = 0, 400
    halign = center
    valign = center
}

# ─── LOCK ICON + LABEL ───────────────────────────────────
label {
    monitor =
    text = 󰍁  Locked
    color = rgba(0, 229, 195, 0.70)
    font_size = 15
    font_family = Maple Mono NF
    position = 0, 295
    halign = center
    valign = center
}

# ─── CLOCK (HH:MM) ────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(180, 255, 230, 0.95)
    font_size = 100
    font_family = Maple Mono NF Bold
    position = 0, 170
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 229, 195, 0.45)
    shadow_boost = 1.5
}

# ─── DATE ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(168, 230, 240, 0.65)
    font_size = 16
    font_family = Maple Mono NF
    position = 0, 68
    halign = center
    valign = center
}

# ─── DIVIDER LINE ─────────────────────────────────────────
label {
    monitor =
    text = ──────────────────
    color = rgba(0, 229, 195, 0.25)
    font_size = 11
    font_family = Maple Mono NF
    position = 0, 22
    halign = center
    valign = center
}

# ─── GREETING ─────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] echo "$(hour=$(date +%H); if [ $hour -lt 12 ]; then echo '󰖨  Good Morning'; elif [ $hour -lt 17 ]; then echo '󰖙  Good Afternoon'; else echo '󰖔  Good Evening'; fi)"
    color = rgba(61, 255, 160, 0.85)
    font_size = 13
    font_family = Maple Mono NF
    position = 0, -12
    halign = center
    valign = center
}

# ─── PASSWORD INPUT ───────────────────────────────────────
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    rounding = 14

    outer_color = rgba(0, 229, 195, 0.70)
    inner_color = rgba(10, 28, 20, 0.85)
    font_color = rgb(168, 230, 240)

    check_color = rgba(255, 107, 107, 0.90)
    fail_color = rgba(255, 107, 107, 0.90)
    fail_text = <span size="small"><i>$FAIL  ($ATTEMPTS)</i></span>

    font_family = Maple Mono NF
    placeholder_text = <span foreground="##00e5c3" size="small">󰌾  Enter Password</span>

    fade_on_empty = true
    hide_input = false

    position = 0, -88
    halign = center
    valign = center
}

# ─── USERNAME ─────────────────────────────────────────────
label {
    monitor =
    text =  HIGH HILLZ
    color = rgba(168, 230, 240, 0.50)
    font_size = 12
    font_family = Maple Mono NF
    position = 0, -158
    halign = center
    valign = center
}

# ─── SPOTIFY MEDIA PLAYER ─────────────────────────────────
label {
    monitor =
    text = cmd[update:2000] /home/high-hillz/.config/hypr/scripts/spotify-lock.sh title
    color = rgba(0, 229, 195, 0.90)
    font_size = 14
    font_family = Maple Mono NF
    position = 0, -218
    halign = center
    valign = center
}

# Artist + album
label {
    monitor =
    text = cmd[update:2000] /home/high-hillz/.config/hypr/scripts/spotify-lock.sh artist
    color = rgba(168, 230, 240, 0.55)
    font_size = 11
    font_family = Maple Mono NF
    position = 0, -245
    halign = center
    valign = center
}

# ─── SYSTEM INFO BAR (bottom centre) ─────────────────────
# Battery (left) — shows charging bolt when plugged in
label {
    monitor =
    text = cmd[update:15000] echo "$(bat=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); status=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); if [ -n "$bat" ]; then if [ "$status" = "Charging" ]; then if [ $bat -ge 90 ]; then icon="󰂅"; elif [ $bat -ge 80 ]; then icon="󰂄"; elif [ $bat -ge 60 ]; then icon="󰂊"; elif [ $bat -ge 40 ]; then icon="󰂈"; elif [ $bat -ge 20 ]; then icon="󰂆"; else icon="󰢜"; fi; echo "$icon $bat%"; else if [ $bat -ge 80 ]; then icon="󰁹"; elif [ $bat -ge 60 ]; then icon="󰂀"; elif [ $bat -ge 40 ]; then icon="󰁾"; elif [ $bat -ge 20 ]; then icon="󰁼"; else icon="󰁺"; fi; echo "$icon $bat%"; fi; fi)"
    color = rgba(140, 200, 180, 0.60)
    font_size = 11
    font_family = Maple Mono NF
    position = -200, -370
    halign = center
    valign = center
}

# Keyboard Layout (centre)
label {
    monitor =
    text = cmd[update:5000] /home/high-hillz/.config/hypr/scripts/kb-layout.sh
    color = rgba(140, 200, 180, 0.60)
    font_size = 11
    font_family = Maple Mono NF
    position = 0, -370
    halign = center
    valign = center
}


# ─── DECORATIVE BOTTOM DOTS ──────────────────────────────
label {
    monitor =
    text =   ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  
    color = rgba(0, 229, 195, 0.14)
    font_size = 9
    font_family = Maple Mono NF
    position = 0, -400
    halign = center
    valign = center
}
