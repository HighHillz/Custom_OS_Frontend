# ╔═══════════════════════════════════════════════════════╗
# ║              HYPRLOCK — ENHANCED LOCK SCREEN          ║
# ╚═══════════════════════════════════════════════════════╝

# ─── BACKGROUND ───────────────────────────────────────────
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.0117
    contrast = 0.8
    brightness = 0.2
    vibrancy = 0.3
    vibrancy_darkness = 0.6
}

# ─── GENERAL ──────────────────────────────────────────────
general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

# ─── DECORATIVE TOP ACCENT LINE ───────────────────────────
# Simulated with a thin label acting as a rule
label {
    monitor =
    text =   ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  
    color = rgba(0, 240, 255, 0.18)
    font_size = 9
    font_family = JetBrains Mono Nerd Font
    position = 0, 400
    halign = center
    valign = center
}

# ─── LOCK ICON + LABEL ───────────────────────────────────
label {
    monitor =
    text = 󰍁  Locked
    color = rgba(0, 240, 255, 0.60)
    font_size = 15
    font_family = JetBrains Mono Nerd Font
    position = 0, 295
    halign = center
    valign = center
}

# ─── CLOCK (HH:MM) ────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(168, 249, 255, 0.95)
    font_size = 100
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 170
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 240, 255, 0.3)
    shadow_boost = 1.5
}

# ─── DATE ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(180, 200, 220, 0.7)
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    position = 0, 68
    halign = center
    valign = center
}

# ─── DIVIDER LINE ─────────────────────────────────────────
label {
    monitor =
    text = ──────────────────
    color = rgba(0, 240, 255, 0.22)
    font_size = 11
    font_family = JetBrains Mono Nerd Font
    position = 0, 22
    halign = center
    valign = center
}

# ─── GREETING ─────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] echo "$(hour=$(date +%H); if [ $hour -lt 12 ]; then echo '󰖨  Good Morning'; elif [ $hour -lt 17 ]; then echo '󰖙  Good Afternoon'; else echo '󰖔  Good Evening'; fi)"
    color = rgba(255, 0, 127, 0.85)
    font_size = 13
    font_family = JetBrains Mono Nerd Font
    position = 0, -12
    halign = center
    valign = center
}

# ─── PASSWORD INPUT ───────────────────────────────────────
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    rounding = 14

    outer_color = rgba(0, 240, 255, 0.65)
    inner_color = rgba(8, 10, 18, 0.80)
    font_color = rgb(220, 235, 255)

    check_color = rgba(255, 0, 127, 0.85)
    fail_color = rgba(255, 60, 60, 0.9)
    fail_text = <span size="small"><i>$FAIL  ($ATTEMPTS)</i></span>

    font_family = JetBrains Mono Nerd Font
    placeholder_text = <span foreground="##00f0ff" size="small">󰌾  Enter Password</span>

    fade_on_empty = true
    hide_input = false

    position = 0, -88
    halign = center
    valign = center
}

# ─── USERNAME ─────────────────────────────────────────────
label {
    monitor =
    text =  HIGH HILLZ
    color = rgba(255, 255, 255, 0.45)
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = 0, -158
    halign = center
    valign = center
}

# ─── SPOTIFY MEDIA PLAYER ─────────────────────────────────
# Uses a script so hyprlock cmd[] quoting stays clean
label {
    monitor =
    text = cmd[update:2000] /home/high-hillz/.config/hypr/scripts/spotify-lock.sh title
    color = rgba(30, 215, 96, 0.90)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 0, -218
    halign = center
    valign = center
}

# Artist + album
label {
    monitor =
    text = cmd[update:2000] /home/high-hillz/.config/hypr/scripts/spotify-lock.sh artist
    color = rgba(180, 200, 220, 0.50)
    font_size = 11
    font_family = JetBrains Mono Nerd Font
    position = 0, -245
    halign = center
    valign = center
}

# ─── SYSTEM INFO BAR (bottom center) ─────────────────────
# Uptime
label {
    monitor =
    text = cmd[update:60000] echo "󰅐 $(uptime -p | sed 's/up //')"
    color = rgba(130, 160, 200, 0.55)
    font_size = 11
    font_family = JetBrains Mono Nerd Font
    position = -200, -370
    halign = center
    valign = center
}

# Keyboard Layout (center)
label {
    monitor =
    text = cmd[update:5000] echo "󰌌 $(hyprctl devices -j 2>/dev/null | python3 -c \"import sys,json; d=json.load(sys.stdin); kb=[k for k in d.get('keyboards',[]) if 'power' not in k.get('name','').lower()]; print(kb[0]['active_keymap'].split(' ')[0] if kb else 'US')\" 2>/dev/null || echo 'US')"
    color = rgba(130, 160, 200, 0.55)
    font_size = 11
    font_family = JetBrains Mono Nerd Font
    position = 0, -370
    halign = center
    valign = center
}

# Battery (right) — shows charging bolt when plugged in
label {
    monitor =
    text = cmd[update:15000] echo "$(bat=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); status=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); if [ -n "$bat" ]; then if [ "$status" = "Charging" ]; then if [ $bat -ge 90 ]; then icon="󰂅"; elif [ $bat -ge 80 ]; then icon="󰂄"; elif [ $bat -ge 60 ]; then icon="󰂊"; elif [ $bat -ge 40 ]; then icon="󰂈"; elif [ $bat -ge 20 ]; then icon="󰂆"; else icon="󰢜"; fi; echo "$icon $bat%"; else if [ $bat -ge 80 ]; then icon="󰁹"; elif [ $bat -ge 60 ]; then icon="󰂀"; elif [ $bat -ge 40 ]; then icon="󰁾"; elif [ $bat -ge 20 ]; then icon="󰁼"; else icon="󰁺"; fi; echo "$icon $bat%"; fi; fi)"
    color = rgba(130, 160, 200, 0.55)
    font_size = 11
    font_family = JetBrains Mono Nerd Font
    position = 200, -370
    halign = center
    valign = center
}

# ─── DECORATIVE BOTTOM DOTS ──────────────────────────────
label {
    monitor =
    text =   ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  
    color = rgba(0, 240, 255, 0.12)
    font_size = 9
    font_family = JetBrains Mono Nerd Font
    position = 0, -400
    halign = center
    valign = center
}
